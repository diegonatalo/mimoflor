name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    # Postgres descartável, só para o build e o E2E: o CI nunca toca no Neon.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mimoflor
          POSTGRES_PASSWORD: mimoflor
          POSTGRES_DB: mimoflor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mimoflor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mimoflor:mimoflor@localhost:5432/mimoflor
    steps:
      - uses: actions/checkout@v7
      # Usa a versão do pnpm do campo packageManager do package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm db:migrate
      # A Vercel só publica a main (vercel.json), então o build do PR roda aqui.
      - run: pnpm build
      # E2E só nos projetos com Playwright, contra o build acima.
      - if: hashFiles('playwright.config.ts') != ''
        run: pnpm exec playwright install --with-deps chromium
      - if: hashFiles('playwright.config.ts') != ''
        run: pnpm test:e2e
