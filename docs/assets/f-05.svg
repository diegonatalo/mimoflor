<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="490" height="290" viewBox="0 0 490 290" role="img" aria-label="Convite antes da flor. Quem recebe vê “Ana, chegou uma flor pra você” e um botão para abrir. A flor nasce ao tocar, e dá para ver nascer de novo."><title>Convite antes da flor. Quem recebe vê “Ana, chegou uma flor pra você” e um botão para abrir. A flor nasce ao tocar, e dá para ver nascer de novo.</title><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7fa6"/><stop offset="1" stop-color="#86cfa6"/></linearGradient><radialGradient id="fc" gradientUnits="userSpaceOnUse" cx="490" cy="0" r="220"><stop offset="0" stop-color="#ff7fa6" stop-opacity="0.18"/><stop offset="1" stop-color="#ff7fa6" stop-opacity="0"/></radialGradient><clipPath id="fk"><rect width="490" height="290" rx="22"/></clipPath></defs><rect x="0.5" y="0.5" width="489" height="289" rx="22" fill="#1b1526" stroke="#4a3d5e"/><g clip-path="url(#fk)"><rect width="490" height="290" fill="url(#fc)"/><rect width="490" height="4" fill="url(#g)"/></g><text x="32" y="44" font-family="'Cascadia Code',Menlo,Consolas,monospace" font-size="12" letter-spacing="1.4" fill="#8d84a0">FUNCIONALIDADE 05</text><text x="32" y="82" font-family="Fraunces,Georgia,'Times New Roman',serif" font-size="28" font-weight="700" fill="#f3eef8">Convite antes da flor</text><text x="32" y="116" font-family="Fraunces,Georgia,'Times New Roman',serif" font-size="14.5" fill="#ada4be">Quem recebe vê “Ana, chegou uma flor pra você” e um</text><text x="32" y="138" font-family="Fraunces,Georgia,'Times New Roman',serif" font-size="14.5" fill="#ada4be">botão para abrir. A flor nasce ao tocar, e dá para ver</text><text x="32" y="160" font-family="Fraunces,Georgia,'Times New Roman',serif" font-size="14.5" fill="#ada4be">nascer de novo.</text></svg>
