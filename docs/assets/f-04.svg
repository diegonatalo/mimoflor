<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="490" height="290" viewBox="0 0 490 290" role="img" aria-label="Cifrado no aparelho. A flor é cifrada no navegador com AES-GCM. O banco guarda só o texto cifrado; a chave vai depois do #, que nunca chega ao servidor."><title>Cifrado no aparelho. A flor é cifrada no navegador com AES-GCM. O banco guarda só o texto cifrado; a chave vai depois do #, que nunca chega ao servidor.</title><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7fa6"/><stop offset="1" stop-color="#86cfa6"/></linearGradient><radialGradient id="fc" gradientUnits="userSpaceOnUse" cx="490" cy="0" r="220"><stop offset="0" stop-color="#ff7fa6" stop-opacity="0.18"/><stop offset="1" stop-color="#ff7fa6" stop-opacity="0"/></radialGradient><clipPath id="fk"><rect width="490" height="290" rx="22"/></clipPath></defs><rect x="0.5" y="0.5" width="489" height="289" rx="22" fill="#1b1526" stroke="#4a3d5e"/><g clip-path="url(#fk)"><rect width="490" height="290" fill="url(#fc)"/><rect width="490" height="4" fill="url(#g)"/></g><text x="32" y="44" font-family="'Cascadia Code',Menlo,Consolas,monospace" font-size="12" letter-spacing="1.4" fill="#8d84a0">FUNCIONALIDADE 04</text><text x="32" y="82" font-family="Fraunces,Georgia,'Times New Roman',serif" font-size="28" font-weight="700" fill="#f3eef8">Cifrado no aparelho</text><text x="32" y="116" font-family="Fraunces,Georgia,'Times New Roman',serif" font-size="14.5" fill="#ada4be">A flor é cifrada no navegador com AES-GCM. O banco</text><text x="32" y="138" font-family="Fraunces,Georgia,'Times New Roman',serif" font-size="14.5" fill="#ada4be">guarda só o texto cifrado; a chave vai depois do #,</text><text x="32" y="160" font-family="Fraunces,Georgia,'Times New Roman',serif" font-size="14.5" fill="#ada4be">que nunca chega ao servidor.</text></svg>
